<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akula Cybersec Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-display">
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Page Not Found</h1>
            <p class="text-gray-600 mb-8">The page you're looking for doesn't exist.</p>
            <a href="index.html" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded">
                Go to Homepage
            </a>
        </div>
    </div>
    
    <script>
        // GitHub Pages fallback routing
        (function() {
            // Parse the current path
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, -1).join('/') + '/?/' +
                l.pathname.slice(1).split('/').indexOf('.') !== -1 ? '/' : ''
            );
            
            var segmentCount = 0;
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, -1).join('/').replace(/&/g, '~and~') +
                '?/' + l.pathname.slice(1).replace(/&/g, '~and~') + '&' +
                l.search.replace(/&/g, '~and~') + l.hash.replace(/&/g, '~and~')
            );
        })();
    </script>
</body>
</html>
